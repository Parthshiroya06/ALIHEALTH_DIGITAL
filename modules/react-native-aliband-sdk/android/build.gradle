// Nitro module wrapping the H Band (Veepoo) SDK.
// The SDK .aar files live in the app (android/app/libs, downloaded by `yarn sdk:hband`);
// this library only compiles against them.

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["AliBandSdk_" + name]
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"
apply from: "../nitrogen/generated/android/AliBandSdk+autolinking.gradle"
apply plugin: "com.facebook.react"

android {
  namespace "com.margelo.nitro.alibandsdk"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrDefault("compileSdkVersion").toInteger()

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion").toInteger()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packagingOptions {
    excludes = [
      "META-INF",
      "META-INF/**",
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation project(":react-native-nitro-modules")

  // H Band SDK – packaged by the app, compiled against here
  compileOnly fileTree(dir: "${rootProject.projectDir}/app/libs", include: ["*.aar", "*.jar"])
}

react {
  jsRootDir = file("../src/")
  libraryName = "AliBandSdk"
  codegenJavaPackageName = "com.margelo.nitro.alibandsdk"
}
